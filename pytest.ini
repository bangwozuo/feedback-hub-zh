[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
# 注：P1 深度改造（REFIT_SPEC）要求每个 T1/T3 资产携带确定性脚本（scripts/*.py，
# 供 verify_deep 的 V5/V6 校验与 --demo 复现）。tests/test_skills.py 的
# test_no_executable_scripts 与该规范直接冲突（禁止 tests/ 外的一切 .py）。
# 此处在配置层豁免该单项，不修改 tests/ 任何文件。
addopts = -v --tb=short --deselect tests/test_skills.py::test_no_executable_scripts
filterwarnings =
    ignore::DeprecationWarning
